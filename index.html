<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>What Do You Love? - Procedural Canvas Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0d19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 12px;
    }

    .header {
      text-align: center;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .header p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .player-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 65vh;
      max-height: 65dvh;
      aspect-ratio: 1000 / 1140;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Start / Overlay Screen */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(11, 13, 25, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      cursor: pointer;
    }

    .overlay-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .play-btn-large {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #df5a35, #cf6f4d);
      border: 3px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(223, 90, 53, 0.45);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .play-btn-large:active {
      transform: scale(0.92);
    }

    .play-btn-large svg {
      width: 32px;
      height: 32px;
      margin-left: 3px;
      fill: currentColor;
    }

    .overlay-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 14px;
      color: #fff;
    }

    .overlay-sub {
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-top: 4px;
    }

    /* Bottom Control Bar */
    .controls-card {
      width: 100%;
      max-width: 480px;
      background: rgba(22, 27, 46, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px 14px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .scrubber {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #df5a35;
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease;
    }

    .scrubber::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    .time-display {
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      color: #94a3b8;
      min-width: 75px;
      text-align: right;
    }

    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-group-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .icon-btn.primary {
      background: #df5a35;
      border-color: #f06a45;
      color: #fff;
    }

    .icon-btn.primary:hover {
      background: #e56b46;
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Scene Jump Chips */
    .scenes-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-top: 4px;
      scrollbar-width: none;
    }

    .scenes-row::-webkit-scrollbar {
      display: none;
    }

    .scene-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      font-size: 0.72rem;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .scene-chip:hover, .scene-chip.active {
      background: rgba(223, 90, 53, 0.25);
      border-color: #df5a35;
      color: #ff9d82;
    }

    /* Recording Badge */
    .rec-badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>
      <span>What Do You Love?</span>
      <span style="font-size: 0.6em; background: #df5a35; color: white; padding: 2px 7px; border-radius: 4px; font-weight: 700;">HTML5 CANVAS</span>
    </h1>
    <p>Procedural frame-by-frame animation & real-time Web Audio API synthesis</p>
  </div>

  <div class="player-container" id="playerContainer">
    <canvas id="animCanvas"></canvas>

    <!-- Overlay Screen for Initial Play / Audio unlock -->
    <div class="overlay-screen" id="overlayScreen">
      <div class="play-btn-large" id="bigPlayBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="overlay-title">Play Animation</div>
      <div class="overlay-sub">Click to start with synchronized music</div>
    </div>
  </div>

  <!-- Player Controls -->
  <div class="controls-card">
    <!-- Scrubber -->
    <div class="timeline-row">
      <input type="range" id="scrubber" class="scrubber" min="0" max="16.5" step="0.05" value="0">
      <div class="time-display" id="timeDisplay">0:00 / 0:16</div>
    </div>

    <!-- Play/Pause & Actions -->
    <div class="buttons-row">
      <div class="btn-group-left">
        <button class="icon-btn primary" id="playPauseBtn" title="Play / Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button class="icon-btn" id="restartBtn" title="Restart">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>

        <button class="icon-btn" id="muteBtn" title="Toggle Sound">
          <svg id="soundOnIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="soundOffIcon" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>

        <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>

        <div id="recBadge" class="rec-badge">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;"></span>
          REC
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="action-btn" id="snapshotBtn" title="Take Snapshot PNG">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm8 14a5 5 0 100-10 5 5 0 000 10z"/></svg>
          Snapshot
        </button>
        <button class="action-btn" id="recordBtn" title="Export Video File">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>
          Export
        </button>
      </div>
    </div>

    <!-- Quick Scene Jump Chips -->
    <div class="scenes-row">
      <button class="scene-chip" data-time="0.0">1. Note</button>
      <button class="scene-chip" data-time="2.5">2. Window</button>
      <button class="scene-chip" data-time="4.5">3. Flight</button>
      <button class="scene-chip" data-time="7.5">4. Words</button>
      <button class="scene-chip" data-time="8.4">5. Trees</button>
      <button class="scene-chip" data-time="9.3">6. Rain</button>
      <button class="scene-chip" data-time="10.2">7. Stars</button>
      <button class="scene-chip" data-time="11.2">8. Heart</button>
      <button class="scene-chip" data-time="14.2">9. [You]</button>
      <button class="scene-chip" data-time="15.3">10. Town</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="animation.js"></script>
  <script>
    const canvas = document.getElementById('animCanvas');
    const playerContainer = document.getElementById('playerContainer');
    const audio = new AnimationAudio();
    const anim = new WhatDoYouLoveAnimation(canvas);

    // Initial first frame render
    anim.render(0);

    // UI elements
    const overlayScreen = document.getElementById('overlayScreen');
    const bigPlayBtn = document.getElementById('bigPlayBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');
    const soundOnIcon = document.getElementById('soundOnIcon');
    const soundOffIcon = document.getElementById('soundOffIcon');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const scrubber = document.getElementById('scrubber');
    const timeDisplay = document.getElementById('timeDisplay');
    const snapshotBtn = document.getElementById('snapshotBtn');
    const recordBtn = document.getElementById('recordBtn');
    const recBadge = document.getElementById('recBadge');
    const sceneChips = document.querySelectorAll('.scene-chip');

    let isMuted = false;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    function formatTime(s) {
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updatePlayState(playing) {
      if (playing) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        overlayScreen.classList.add('hidden');
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    function startPlayback() {
      audio.init();
      if (!isMuted) audio.start(anim.currentTime);
      anim.play();
      updatePlayState(true);
    }

    function pausePlayback() {
      audio.stop();
      anim.pause();
      updatePlayState(false);
    }

    // Play/Pause button
    playPauseBtn.addEventListener('click', () => {
      if (anim.isPlaying) {
        pausePlayback();
      } else {
        startPlayback();
      }
    });

    // Tap canvas to play/pause on touch devices
    canvas.addEventListener('click', () => {
      if (overlayScreen.classList.contains('hidden')) {
        if (anim.isPlaying) pausePlayback();
        else startPlayback();
      }
    });

    // Touch and click on big play button
    ['click', 'touchend'].forEach(evt => {
      bigPlayBtn.addEventListener(evt, (e) => {
        e.preventDefault();
        startPlayback();
      }, { passive: false });
    });

    // Fullscreen support
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        playerContainer.requestFullscreen().catch(err => {
          console.log('Fullscreen error:', err);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Restart
    restartBtn.addEventListener('click', () => {
      anim.seek(0);
      scrubber.value = 0;
      timeDisplay.textContent = `0:00 / ${formatTime(anim.duration)}`;
      startPlayback();
    });

    // Mute toggle
    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      audio.setVolume(isMuted ? 0 : 0.7);
      if (isMuted) {
        soundOnIcon.style.display = 'none';
        soundOffIcon.style.display = 'block';
      } else {
        soundOnIcon.style.display = 'block';
        soundOffIcon.style.display = 'none';
      }
    });

    // Scrubber input
    scrubber.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      anim.seek(val);
      timeDisplay.textContent = `${formatTime(val)} / ${formatTime(anim.duration)}`;
      if (anim.isPlaying) {
        audio.start(val);
      }
    });

    // Animation progress hook
    window.onAnimationUpdate = (cur, total) => {
      scrubber.value = cur;
      timeDisplay.textContent = `${formatTime(cur)} / ${formatTime(total)}`;

      // Highlight active scene chip
      sceneChips.forEach(chip => {
        const chipTime = parseFloat(chip.dataset.time);
        chip.classList.toggle('active', Math.abs(cur - chipTime) < 1.0);
      });
    };

    window.onAnimationComplete = () => {
      audio.stop();
      updatePlayState(false);
      if (isRecording && mediaRecorder) {
        mediaRecorder.stop();
      }
    };

    // Scene quick-jump buttons
    sceneChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const target = parseFloat(chip.dataset.time);
        anim.seek(target);
        scrubber.value = target;
        timeDisplay.textContent = `${formatTime(target)} / ${formatTime(anim.duration)}`;
        if (anim.isPlaying) {
          audio.start(target);
        }
      });
    });

    // Snapshot feature
    snapshotBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = `frame_${anim.currentTime.toFixed(1)}s.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

    // Video Recording Feature
    recordBtn.addEventListener('click', () => {
      if (isRecording) return;
      isRecording = true;
      recordedChunks = [];
      recBadge.style.display = 'flex';
      recordBtn.textContent = 'Recording...';

      // Capture stream from canvas + audio destination
      const canvasStream = canvas.captureStream(60);
      audio.init();

      // Mixed stream
      const dest = audio.ctx.createMediaStreamDestination();
      audio.masterGain.connect(dest);
      const combinedTracks = [...canvasStream.getVideoTracks(), ...dest.stream.getAudioTracks()];
      const combinedStream = new MediaStream(combinedTracks);

      mediaRecorder = new MediaRecorder(combinedStream, {
        mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm'
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        isRecording = false;
        recBadge.style.display = 'none';
        recordBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg> Export`;

        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'what_do_you_love_animation.webm';
        a.click();
      };

      mediaRecorder.start();
      anim.seek(0);
      startPlayback();
    });
  </script>
</body>
</html>
